<div class="encabezado">
  <h1>Sedes</h1>
  <button mat-flat-button color="primary" (click)="abrirAlta()">
    <mat-icon>add</mat-icon>
    Nueva sede
  </button>
</div>

<mat-form-field appearance="outline" class="filtro">
  <mat-label>Buscar</mat-label>
  <input matInput [formControl]="filtro" placeholder="Nombre, dirección o teléfono" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (cargando()) {
  <div class="cargando">
    <mat-spinner diameter="40" />
  </div>
} @else if (sedesFiltradas.length === 0) {
  <app-empty-state mensaje="No hay sedes para mostrar." icono="apartment" />
} @else {
  <table mat-table [dataSource]="sedesFiltradas" class="tabla">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let sede">{{ sede.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="direccion">
      <th mat-header-cell *matHeaderCellDef>Dirección</th>
      <td mat-cell *matCellDef="let sede">{{ sede.direccion }}</td>
    </ng-container>

    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef>Teléfono</th>
      <td mat-cell *matCellDef="let sede">{{ sede.telefono }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let sede">
        <button mat-icon-button matTooltip="Editar" (click)="abrirEdicion(sede)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Eliminar" (click)="eliminar(sede)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>
}
