<div class="encabezado">
  <h1>Coberturas</h1>
  <button mat-flat-button color="primary" (click)="abrirAlta()">
    <mat-icon>add</mat-icon>
    Nueva cobertura
  </button>
</div>

<mat-form-field appearance="outline" class="filtro">
  <mat-label>Buscar</mat-label>
  <input matInput [formControl]="filtro" placeholder="Nombre" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (cargando()) {
  <div class="cargando">
    <mat-spinner diameter="40" />
  </div>
} @else if (coberturasFiltradas.length === 0) {
  <app-empty-state mensaje="No hay coberturas para mostrar." icono="health_and_safety" />
} @else {
  <table mat-table [dataSource]="coberturasFiltradas" class="tabla">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let cobertura">{{ cobertura.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let cobertura">
        <button mat-icon-button matTooltip="Editar" (click)="abrirEdicion(cobertura)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Eliminar" (click)="eliminar(cobertura)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>
}
