<div class="registro-page">
  <mat-card appearance="outlined" class="registro-card">
    <div class="registro-encabezado">
      <div class="registro-icono-circulo">
        <mat-icon>person_add</mat-icon>
      </div>
      <h2>Registro de paciente</h2>
      <p class="registro-subtitulo">Completá tus datos para crear tu cuenta</p>
    </div>

    <app-paciente-form
      [cargando]="cargando()"
      [errorMensaje]="errorMensaje()"
      textoBoton="Registrarme"
      (enviarFormulario)="registrar($event)"
    />

    <p class="registro-link">¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
  </mat-card>
</div>
