<div class="app-shell">
  <app-header [mostrarToggleMenu]="esMovil() && !!usuario()" (toggleMenu)="toggleSidenav()"></app-header>

  <mat-sidenav-container class="app-body" [class.sin-sesion]="!usuario()">
    @if (usuario()) {
      <mat-sidenav
        #sidenav
        class="app-sidenav"
        [mode]="esMovil() ? 'over' : 'side'"
        [opened]="!esMovil()"
      >
        <app-menu (itemClick)="cerrarSidenavSiMovil()"></app-menu>
      </mat-sidenav>
    }

    <mat-sidenav-content class="app-content-wrapper">
      <main class="app-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <app-footer></app-footer>
</div>
