@if (label) {
  <span class="hora-input-label">{{ label }}</span>
}
<div class="hora-input" [class.deshabilitado]="deshabilitado()">
  <div class="segmento">
    <button
      type="button"
      class="chevron"
      [disabled]="deshabilitado()"
      (click)="incrementarHora()"
      aria-label="Aumentar hora"
    >
      <mat-icon>expand_less</mat-icon>
    </button>
    <input
      type="text"
      inputmode="numeric"
      maxlength="2"
      class="valor"
      [value]="horaTexto"
      [disabled]="deshabilitado()"
      (blur)="editarHora($any($event.target).value)"
      aria-label="Hora"
    />
    <button
      type="button"
      class="chevron"
      [disabled]="deshabilitado()"
      (click)="decrementarHora()"
      aria-label="Disminuir hora"
    >
      <mat-icon>expand_more</mat-icon>
    </button>
  </div>

  <span class="separador">:</span>

  <div class="segmento">
    <button
      type="button"
      class="chevron"
      [disabled]="deshabilitado()"
      (click)="incrementarMinuto()"
      aria-label="Aumentar minutos"
    >
      <mat-icon>expand_less</mat-icon>
    </button>
    <input
      type="text"
      inputmode="numeric"
      maxlength="2"
      class="valor"
      [value]="minutoTexto"
      [disabled]="deshabilitado()"
      (blur)="editarMinuto($any($event.target).value)"
      aria-label="Minutos"
    />
    <button
      type="button"
      class="chevron"
      [disabled]="deshabilitado()"
      (click)="decrementarMinuto()"
      aria-label="Disminuir minutos"
    >
      <mat-icon>expand_more</mat-icon>
    </button>
  </div>
</div>
